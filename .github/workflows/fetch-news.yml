name: Fetch Sea Cadets News

on:
  schedule:
    - cron: '0 6 * * *'   # Daily at 6 AM UTC
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch RSS feed
        run: python3 scripts/fetch_seacadets_news.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/seacadets-news.json
          git diff --cached --quiet || (git commit -m "chore: update Sea Cadets national news" && git push)
